# Staging on every merge to main; production on a published release, after approval.
# Enabled once the repository variable DEPLOY_ENABLED is "true" (see docs/SETUP.md).
name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: deploy-${{ github.event_name == 'release' && 'production' || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Production requires a reviewer's approval (set on the "production" environment in GitHub).
    environment: ${{ github.event_name == 'release' && 'production' || 'staging' }}
    env:
      TARGET: ${{ github.event_name == 'release' && 'production' || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test

      # Migrations must be backward compatible (add first, remove in a later release),
      # because the old Worker version keeps serving until the new one is live.
      - name: Apply database migrations
        working-directory: apps/edge
        run: pnpm exec wrangler d1 migrations apply DB --remote --env "$TARGET"

      - name: Deploy the API
        working-directory: apps/edge
        run: pnpm exec wrangler deploy --env "$TARGET"

      # The Worker's secrets come from this GitHub environment, so nobody sets them by hand.
      - name: Set the API's secrets
        working-directory: apps/edge
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TICKET_SECRET: ${{ secrets.TICKET_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Set on the staging environment only, so strangers can't use staging to send email.
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
        run: |
          set -o pipefail
          # Staging and production send sign-in codes through Resend, so the API refuses to start without its key.
          for key in BETTER_AUTH_SECRET TICKET_SECRET RESEND_API_KEY; do
            [ -n "${!key}" ] || { echo "Missing secret $key on the \"$TARGET\" environment (see docs/SETUP.md)."; exit 1; }
          done
          jq -n 'env | {BETTER_AUTH_SECRET, TICKET_SECRET, RESEND_API_KEY, ALLOWED_EMAILS} | with_entries(select(.value != null and .value != ""))' \
            | pnpm exec wrangler secret bulk --env "$TARGET"

      - name: Smoke test the API
        run: |
          host=$([ "$TARGET" = production ] && echo api.buildpair.app || echo api-staging.buildpair.app)
          for i in 1 2 3 4 5; do curl --fail --silent "https://$host/health" && exit 0; sleep 5; done
          echo "Health check failed; roll back with: pnpm --filter @buildpair/edge exec wrangler rollback --env $TARGET"
          exit 1

      - name: Deploy the web app
        working-directory: apps/app
        env:
          EXPO_PUBLIC_API_URL: ${{ env.TARGET == 'production' && 'https://api.buildpair.app' || 'https://api-staging.buildpair.app' }}
        run: pnpm build:web && pnpm exec wrangler deploy --env "$TARGET"

      - name: Deploy the landing site
        working-directory: apps/site
        run: pnpm exec wrangler deploy --env "$TARGET"

      - uses: expo/expo-github-action@v9
        if: env.HAS_EXPO_TOKEN == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish the app update (JS-only changes reach phones without a store release)
        if: env.HAS_EXPO_TOKEN == 'true'
        working-directory: apps/app
        env:
          EXPO_PUBLIC_API_URL: ${{ env.TARGET == 'production' && 'https://api.buildpair.app' || 'https://api-staging.buildpair.app' }}
        run: eas update --branch "$TARGET" --message "${{ github.event.release.tag_name || github.sha }}" --non-interactive
