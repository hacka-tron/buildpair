name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the web app
        run: pnpm --filter @buildpair/app build:web

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: End-to-end (sign-up, two people, live chat)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buildpair/e2e exec playwright install --with-deps chromium
      - name: Start the API and the web app locally
        run: |
          cd apps/edge
          printf 'BETTER_AUTH_SECRET=ci-only-%s\nTICKET_SECRET=ci-only-%s\n' "$RANDOM$RANDOM$RANDOM" "$RANDOM$RANDOM$RANDOM" > .dev.vars
          pnpm exec wrangler d1 migrations apply DB --local
          nohup pnpm exec wrangler dev --port 8787 --var EMAIL_PROVIDER:test --var ENVIRONMENT:test > ../../wrangler-api.log 2>&1 &
          cd ../app
          EXPO_PUBLIC_API_URL=http://localhost:8787 pnpm build:web
          nohup pnpm exec wrangler dev --port 8081 --inspector-port 9331 > ../../wrangler-web.log 2>&1 &
          cd ../site
          nohup pnpm exec wrangler dev --port 8788 --inspector-port 9332 > ../../wrangler-site.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8787/health && curl -sf -o /dev/null localhost:8081 && curl -sf -o /dev/null localhost:8788 && exit 0; sleep 2; done
          cat ../../wrangler-*.log; exit 1
      - run: pnpm --filter @buildpair/e2e smoke
      - run: pnpm --filter @buildpair/e2e signup
      - if: failure()
        run: cat wrangler-*.log
